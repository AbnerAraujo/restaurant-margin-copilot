openapi: 3.0.3
info:
  title: My Business Steward — Backend API
  description: |
    The HTTP API backing **My Business Steward** (Restaurant Margin Copilot) —
    a daily-close and margin-alert copilot for an independent restaurant.

    This spec documents every route actually registered in
    `backend/cmd/server/main.go`. It was written by reading the Go handler
    source for each route (`backend/internal/httpapi/*.go`,
    `backend/internal/badges/badges.go`) and cross-checked against `curl`
    calls to a live instance of this backend seeded from
    `backend/fixtures/` — request/response shapes are not guessed from
    route names.

    ### The deterministic / probabilistic split
    Every endpoint except `POST /api/ask` is **pure deterministic REST**:
    plain reads or writes against Postgres-persisted reconciliation output,
    with no model anywhere in the request path. `POST /api/ask` is the one
    endpoint that calls an LLM (Claude Sonnet 5 for an ambiguity gate,
    Claude Sonnet 5 to narrate an already-computed number, Claude Haiku 4.5
    for the paraphrase-match cache classifier) — and even there,
    the model never computes a figure; it only classifies the question and
    narrates a result the Go reconciliation engine already produced.

    ### Conventions used throughout
    - **Money** crosses the wire as an already-formatted decimal string
      (e.g. `"43.26"`, `"-227.09"`), never a float and never raw cents —
      see `internal/money.FormatCents`. A negative margin is a real loss,
      rendered with a leading `-`.
    - **Dates** are `YYYY-MM-DD` strings throughout (`internal/mcptools`'s
      `dateLayout`).
    - **A missing value is `null`, never a fabricated zero.** For example
      an unattributable promotion's `roi` is `null` with
      `reason: "attribution_unavailable"` — a real zero ROI and an unknown
      ROI are different facts and are never conflated.
    - **Errors** across every plain REST endpoint share one flat shape:
      `{"error": "<machine_code>", "detail": "<human string>"}` — see the
      shared `writeJSONError` helper used throughout
      `backend/internal/httpapi/*.go` and `backend/internal/badges/badges.go`.
      `POST /api/ask` is the one exception: a transport-level failure there
      returns a bare `text/plain` body via `http.Error`, not this JSON shape
      (see that operation's own error responses below).
    - **Provenance.** Every computed figure carries `source_row_refs` (or
      `provenance_refs` on `/api/ask`) naming the exact file and row(s) it
      came from — Constitution Principle IV.
  version: "1.0.0"
  contact:
    name: My Business Steward
    url: https://github.com/AbnerAraujo/restaurant-margin-copilot
  license:
    name: Unlicensed take-home prototype (no OSS license granted)
    url: https://github.com/AbnerAraujo/restaurant-margin-copilot#readme
externalDocs:
  description: Project README and full documentation map
  url: https://github.com/AbnerAraujo/restaurant-margin-copilot#readme

servers:
  - url: http://localhost:8080
    description: Local backend (go run ./backend/cmd/server -serve :8080)

# This is a single-owner local prototype with no auth anywhere in
# cmd/server/main.go's route registration — every handler in
# backend/internal/httpapi and backend/internal/badges is reachable
# unauthenticated (see backend/internal/httpapi/client_errors.go's own doc
# comment: "Deliberately unauthenticated and un-rate-limited, matching
# every other endpoint in this single-owner prototype" — and
# docs/rfc-multi-tenant.md's honest accounting of what a real deployment
# would still need). Declared here explicitly rather than left implicit.
security: []

tags:
  - name: Badges
    description: Deterministic, typed "badge" facts evaluated at read time over already-computed data. Never persisted, never decided by a model.
  - name: Reconciliation
    description: Plain read-only REST over the deterministic daily reconciliation output — backs the Close page. No model in the request path.
  - name: Promotions
    description: Promotion / ad-spend ROI records — reading the ingested pipeline's output, and the owner logging a new promotion record directly.
  - name: Platforms
    description: Cross-platform (iFood vs. Just Eat Takeaway) commission and promo-cost economics for a period.
  - name: Usage
    description: The real app-open ping backing Engagement badge evaluation.
  - name: Diagnostics
    description: Frontend crash reporting — a real, timestamped record of a caught React error.
  - name: Cost Sheet Ingestion
    description: Letting the owner upload/replace the supplier cost sheet through the web UI (preview, commit, and a downloadable template).
  - name: Ask
    description: The one model-backed endpoint — natural-language Q&A over the reconciled data, via a pre-processing ambiguity gate and a typed-MCP-tool explanation step.

paths:
  # ------------------------------------------------------------------
  /api/badges:
    get:
      tags: [Badges]
      summary: Get earned badges and points balance
      description: |
        Evaluates all five badge codes across four categories
        (Reconciliation, Growth, Engagement, Campaign-Creation) at read
        time from already-persisted data — nothing here is stored state.

        `?start`/`?end` are **optional** and, per
        `backend/internal/badges/badges.go`'s `RegisterBadgeHandler` doc
        comment, scope **Reconciliation-category badges only**
        (Clean Close / Discrepancy Catcher). Growth, Engagement, and
        Campaign-Creation badges are always evaluated over **all**
        persisted data regardless of this query, the same way
        `GET /api/promotions` is a full listing rather than a period query.
      operationId: getBadges
      parameters:
        - name: start
          in: query
          required: false
          description: Inclusive start date (YYYY-MM-DD). Scopes Reconciliation-category badges only. If given, does not require `end`.
          schema: { type: string, format: date, example: "2026-08-01" }
        - name: end
          in: query
          required: false
          description: Inclusive end date (YYYY-MM-DD). Scopes Reconciliation-category badges only.
          schema: { type: string, format: date, example: "2026-08-14" }
      responses:
        "200":
          description: Badges and points, successfully evaluated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BadgesResponse" }
              example:
                badges:
                  - date: "2026-08-01"
                    code: clean_close
                    name: Clean Close
                    category: reconciliation
                  - date: "2026-08-03"
                    code: discrepancy_catcher
                    name: Discrepancy Catcher
                    category: reconciliation
                    discrepancy_flag_types: [duplicate_order_removed]
                  - date: "2026-08-07"
                    code: growth
                    name: Growth
                    category: growth
                    campaign_id: IFOOD-CAMP-BOOST01
                points:
                  total: 200
                  breakdown:
                    - { code: clean_close, name: Clean Close, count: 12, points_each: 10, points: 120 }
                    - { code: discrepancy_catcher, name: Discrepancy Catcher, count: 2, points_each: 25, points: 50 }
                    - { code: growth, name: Growth, count: 2, points_each: 15, points: 30 }
        "400":
          description: A supplied `start`/`end` is not a valid YYYY-MM-DD date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_period, detail: "parsing time \"not-a-date\" as \"2006-01-02\": cannot parse \"not-a-date\" as \"2006\"" }
        "405":
          description: Any method other than GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: method_not_allowed, detail: "only GET is supported" }
        "500":
          description: A Postgres query failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/reconciliation:
    get:
      tags: [Reconciliation]
      summary: List daily reconciliation results
      description: |
        Returns one `DailySummaryResult` per persisted `DailyReconciliation`
        row in range. A calendar day with no reconciliation is simply
        **absent** from `days`, never present with zeroed figures — a
        missing day and a zero day are different facts.

        `start`/`end` are optional and independent (either may be given
        without the other); omitting both serves everything persisted.
        This is the exact rendering `GET /api/badges`'s period query and a
        chat answer about the same day share — one computation, one
        formatting, everywhere.
      operationId: getReconciliation
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string, format: date, example: "2026-08-01" }
        - name: end
          in: query
          required: false
          schema: { type: string, format: date, example: "2026-08-02" }
      responses:
        "200":
          description: The reconciliation days in range (possibly empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationResponse" }
              example:
                start: "2026-08-01"
                end: "2026-08-02"
                days:
                  - date: "2026-08-01"
                    gross_sales_by_source: { ifood: "69.50", just_eat_takeaway: "76.25", pos: "248.75" }
                    total_delivery_gross_sales: "145.75"
                    commissions: "31.24"
                    refunds: "0.00"
                    input_costs: "320.00"
                    margin: "43.26"
                    discrepancy_flags: []
                    source_row_refs:
                      - { file: "/data/live/delivery_platform_export.csv", row: 2 }
                      - { file: "/data/live/pos_export.csv", row: 2 }
                      - { file: "/data/live/supplier_cost_sheet.csv", row: 2 }
                  - date: "2026-08-02"
                    gross_sales_by_source: { ifood: "72.50", just_eat_takeaway: "81.75", pos: "223.75" }
                    total_delivery_gross_sales: "154.25"
                    commissions: "25.09"
                    refunds: "34.50"
                    input_costs: "545.50"
                    margin: "-227.09"
                    discrepancy_flags: []
                    source_row_refs:
                      - { file: "/data/live/delivery_platform_export.csv", row: 6 }
        "400":
          description: end is before start, or a date is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_period, detail: "end 2026-08-01 is before start 2026-08-05" }
        "405":
          description: Any method other than GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A Postgres query failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/promotions:
    get:
      tags: [Promotions]
      summary: List all promotion ROI records
      description: |
        Every persisted `PromotionRoiRecord` — both pipeline-ingested
        campaigns and owner-created ones (see `POST /api/promotions`) — in
        the same shape `get_promotion_roi` returns to the chat surface.
        This is a full listing, not a period query, matching
        `GET /api/badges`'s Growth/Engagement/Campaign-Creation behavior:
        "which campaigns paid for themselves" is not a question a default
        date window can answer without silently omitting real records.

        `roi`, `attributed_incremental_orders`, and
        `attributed_incremental_revenue` are `null` together, with
        `reason: "attribution_unavailable"` set, exactly when the
        deterministic layer could not attribute incremental orders to the
        campaign (never a fabricated zero).
      operationId: listPromotions
      responses:
        "200":
          description: All promotion records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionsResponse" }
              example:
                promotions:
                  - platform: iFood
                    campaign_id: IFOOD-CAMP-BOOST01
                    period: { start: "2026-08-01", end: "2026-08-07" }
                    spend: "180.00"
                    attributed_incremental_orders: 6
                    attributed_incremental_revenue: "214.00"
                    roi: "34.00"
                    flagged_negative: false
                    source_row_refs:
                      - { file: "fixtures/promotion_ad_spend_export.csv", row: 2 }
                      - { file: "fixtures/delivery_platform_export.csv", row: 2 }
                    origin: ingested
                  - platform: Just Eat Takeaway
                    campaign_id: JET-CAMP-LUNCHFIX
                    period: { start: "2026-08-04", end: "2026-08-10" }
                    spend: "220.00"
                    attributed_incremental_orders: 2
                    attributed_incremental_revenue: "55.00"
                    roi: "-165.00"
                    flagged_negative: true
                    source_row_refs:
                      - { file: "fixtures/promotion_ad_spend_export.csv", row: 3 }
                    origin: ingested
                  - platform: iFood
                    campaign_id: IFOOD-CAMP-WEEKEND
                    period: { start: "2026-08-08", end: "2026-08-09" }
                    spend: "95.00"
                    attributed_incremental_orders: null
                    attributed_incremental_revenue: null
                    roi: null
                    reason: attribution_unavailable
                    flagged_negative: false
                    source_row_refs:
                      - { file: "fixtures/promotion_ad_spend_export.csv", row: 4 }
                    origin: ingested
        "405":
          description: Any method other than GET (the handler this route dispatches to on a non-POST method).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A Postgres query failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Promotions]
      summary: Log a new owner-created promotion record
      description: |
        The owner logging a promotion directly in the app (spec
        002-badge-expansion, User Story 3) — not an ingested pipeline
        record, and never routed through the model's MCP tool boundary.

        If `replaces` is set, the referenced `campaign_id`'s
        `flagged_negative` fact is **re-verified server-side, against the
        live database**, at submission time — a client cannot earn the
        Campaign-Creation badge by lying about what its own UI displayed.
        A `replaces` claim against a campaign that is not currently
        flagged negative is refused with `422 replaces_not_flagged_negative`;
        the promotion can still be logged by omitting `replaces`.
      operationId: createPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePromotionRequest" }
            example:
              platform: iFood
              campaign_id: IFOOD-CAMP-AUTUMN
              period: { start: "2026-08-15", end: "2026-08-21" }
              spend: "120.00"
              replaces: JET-CAMP-LUNCHFIX
      responses:
        "201":
          description: The promotion was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePromotionResponse" }
              example:
                promotion:
                  platform: iFood
                  campaign_id: IFOOD-CAMP-AUTUMN
                  period: { start: "2026-08-15", end: "2026-08-21" }
                  spend: "120.00"
                  attributed_incremental_orders: null
                  attributed_incremental_revenue: null
                  roi: null
                  flagged_negative: false
                  source_row_refs: []
                  origin: owner_created
                  replaces_campaign_id: JET-CAMP-LUNCHFIX
                earned_campaign_creation_badge: true
        "400":
          description: Missing required field(s), a malformed period, or a malformed/negative spend amount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_input, detail: "missing required field(s): platform, campaign_id, period.start/period.end, spend" }
        "405":
          description: Any method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: A promotion for this exact platform, campaign_id, and period already exists (unique constraint).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: already_exists, detail: "a promotion for platform \"iFood\", campaign_id \"IFOOD-CAMP-AUTUMN\", and this exact period already exists" }
        "422":
          description: A `replaces` claim was made against a campaign_id that is not currently flagged negative-ROI.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: replaces_not_flagged_negative, detail: "campaign_id \"IFOOD-CAMP-BOOST01\" is not currently flagged negative-ROI by list_negative_roi_promotions — refusing the replaces claim. The promotion can still be logged without a replaces reference." }
        "500":
          description: A Postgres query failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/platforms:
    get:
      tags: [Platforms]
      summary: Compare delivery-platform economics for a period
      description: |
        Per-platform (iFood, Just Eat Takeaway) gross sales, commission
        paid, effective commission rate, promo spend, and combined
        commission+promo cost/rate for one period — the exact same
        computation (`compare_platform_economics`) a chat answer about the
        same period reads, so the dedicated Platforms page and chat can
        never disagree.

        Unlike `GET /api/reconciliation`, an omitted `start`/`end` here
        does **not** default to a wide-open sentinel range: it defaults to
        the real persisted data's own `[min, max]` date range. `start` and
        `end` must be supplied **together** — one without the other is a
        `400`. `effective_rate`/`combined_effective_rate` are `null`
        (never a fabricated `"0.00%"`) when a platform's gross sales for
        the period are genuinely zero.
      operationId: comparePlatforms
      parameters:
        - name: start
          in: query
          required: false
          description: Inclusive start date. Must be supplied together with `end`, or neither.
          schema: { type: string, format: date, example: "2026-08-01" }
        - name: end
          in: query
          required: false
          description: Inclusive end date. Must be supplied together with `start`, or neither.
          schema: { type: string, format: date, example: "2026-08-14" }
      responses:
        "200":
          description: The comparison for the resolved period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformComparisonResponse" }
              example:
                period: { start: "2026-08-01", end: "2026-08-14" }
                days_included: 14
                platforms:
                  - source: ifood
                    display_name: iFood
                    gross_sales: "838.00"
                    commission_paid: "184.85"
                    effective_rate: "22.06%"
                    promo_spend: "275.00"
                    combined_cost: "459.85"
                    combined_effective_rate: "54.87%"
                    source_row_refs:
                      - { file: "/data/live/delivery_platform_export.csv", row: 2 }
                  - source: just_eat_takeaway
                    display_name: Just Eat Takeaway
                    gross_sales: "612.50"
                    commission_paid: "134.75"
                    effective_rate: "22.00%"
                    promo_spend: "280.00"
                    combined_cost: "414.75"
                    combined_effective_rate: "67.71%"
                    source_row_refs:
                      - { file: "/data/live/delivery_platform_export.csv", row: 6 }
        "400":
          description: Only one of start/end was supplied, end is before start, or a date is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_period, detail: "both start and end are required together, or neither" }
        "405":
          description: Any method other than GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: At least one calendar day in the resolved period has no persisted reconciliation (`insufficient_data`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: insufficient_data, detail: "missing reconciliation for: 2026-08-20" }
        "500":
          description: A Postgres query failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/usage:
    post:
      tags: [Usage]
      summary: Record an app-open usage ping
      description: |
        The real app-open ping backing Engagement badge evaluation (spec
        002-badge-expansion). Deliberately the thinnest possible handler —
        no-double-counting-within-a-calendar-day is enforced at the
        database layer (a unique index on a generated column), not here.
        Fires once per app load regardless of whether today was already
        recorded; the frontend does not need to branch on the response.
      operationId: recordUsage
      responses:
        "200":
          description: The ping was recorded (or today was already on file).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordUsageResponse" }
              examples:
                firstPingToday:
                  summary: First ping today
                  value: { recorded: true }
                repeatPingToday:
                  summary: A later ping the same day
                  value: { recorded: false }
        "405":
          description: Any method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A Postgres query failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/client-errors:
    post:
      tags: [Diagnostics]
      summary: Report a caught frontend error
      description: |
        The React `ErrorBoundary`'s "retro feed" — a real, timestamped
        record of a frontend crash, so the next one leaves a queryable
        trace instead of depending on someone noticing. Deliberately
        unauthenticated and un-rate-limited, matching every other endpoint
        in this single-owner prototype. Only `message`/`component`/
        `stack`/`url`/`user_agent` are accepted — never an arbitrary
        request/state payload that could carry customer data into an
        error log nobody scoped for that.

        A failed write is never surfaced as a second error to a client
        that already gave up on its own render tree: this endpoint reports
        `202` with `logged: false` rather than a `5xx` when the underlying
        write fails. The write is best-effort telemetry, not a guarantee
        this endpoint makes.
      operationId: recordClientError
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientErrorReportRequest" }
            example:
              message: "Cannot read properties of undefined (reading 'margin')"
              component: ChatPanel
              stack: "TypeError: Cannot read properties of undefined ...\n at ChatPanel (ChatPanel.tsx:88:41)"
              url: "http://localhost:5173/close"
              user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
      responses:
        "202":
          description: Accepted — `logged` reports whether the write actually succeeded, but the caller should treat this as a success regardless.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientErrorLoggedResponse" }
              example: { logged: true }
        "400":
          description: Invalid JSON body, or `message` was omitted/empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_input, detail: "message is required" }
        "405":
          description: Any method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/ingest/cost-sheet/preview:
    post:
      tags: [Cost Sheet Ingestion]
      summary: Parse and validate a supplier cost sheet upload (no persistence)
      description: |
        Pure in-memory parsing and validation via `internal/ingest.ParseCostSheet`
        — the exact same parser the `-ingest` CLI flag uses, unchanged, so
        this can never disagree with it. **Never persists anything** and
        never touches `internal/livedata` — spec FR-005.
      operationId: previewCostSheet
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The supplier cost-sheet CSV, field name "file". Bounded at 5MB.
      responses:
        "200":
          description: The parsed, validated rows (not yet committed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewCostSheetResponse" }
              example:
                row_count: 2
                total_amount: "430.50"
                rows:
                  - invoice_id: INV-TEMPLATE-001
                    invoice_date: "2026-01-15"
                    supplier: Example Produce Co.
                    category: produce
                    amount: "250.00"
                    notes: Weekly produce delivery
                    source_row_ref: { file: cost_sheet_upload.csv, row: 2 }
                  - invoice_id: INV-TEMPLATE-002
                    invoice_date: "2026-01-16"
                    supplier: Example Beverage Distributors
                    category: beverage
                    amount: "180.50"
                    notes: "Kegs, soft drinks, mixers"
                    source_row_ref: { file: cost_sheet_upload.csv, row: 3 }
        "400":
          description: The multipart body was malformed, oversized, or missing the "file" field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_upload, detail: "reading uploaded file (expected a multipart field named \"file\"): http: no such file" }
        "405":
          description: Any method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: The file parsed as CSV but failed cost-sheet validation (a specific row/field/missing-column error, never a generic message).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: invalid_cost_sheet, detail: "row 3: field \"amount\": \"twelve dollars\" is not a valid decimal amount" }

  /api/ingest/cost-sheet/commit:
    post:
      tags: [Cost Sheet Ingestion]
      summary: Commit an uploaded cost sheet and re-run reconciliation
      description: |
        Re-validates the upload **from scratch, from the request's own
        bytes** (spec FR-007 — a prior `/preview` call's verdict is never
        trusted), writes it into `internal/livedata.Dir` under a fixed
        filename (never the client's own filename — path traversal via a
        crafted filename is a code shape that cannot occur, not a runtime
        check), clears the answer cache, and re-runs the same
        ingest→reconcile→persist pipeline the `-ingest` CLI flag runs.

        Returns the product's total persisted margin **before** and
        **after** the commit so the effect is visible immediately.
        `margin` is `null` (not `"0.00"`) when there was no prior
        reconciliation data at all — a real absence, not a computed zero.
      operationId: commitCostSheet
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The supplier cost-sheet CSV, field name "file". Bounded at 5MB.
      responses:
        "200":
          description: The cost sheet was committed and reconciliation re-run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitCostSheetResponse" }
              example:
                rows_committed: 12
                before: { days: 14, margin: "-1842.30" }
                after: { days: 14, margin: "-1798.10" }
        "400":
          description: The multipart body was malformed, oversized, or missing the "file" field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "405":
          description: Any method other than POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: The file failed cost-sheet validation on re-check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: |
            A downstream operational failure — reading pre/post-commit margin
            totals (`query_failed`), seeding the live-data directory
            (`live_data_seed_failed`), writing the uploaded file
            (`write_failed`), clearing the answer cache
            (`cache_clear_failed`), or the ingestion pipeline itself failing
            after the file already passed validation (`pipeline_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/ingest/cost-sheet/template:
    get:
      tags: [Cost Sheet Ingestion]
      summary: Download an example cost-sheet CSV template
      description: |
        A static, downloadable example CSV (spec FR-006). The example rows
        are fabricated and clearly labeled ("Example ..."), deliberately
        **not** copied from `backend/fixtures/` — a "template" that turned
        out to secretly be real fixture data would blur the line this
        feature exists to keep bright.
      operationId: downloadCostSheetTemplate
      responses:
        "200":
          description: The template CSV, as an attachment.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="cost_sheet_template.csv"' }
          content:
            text/csv:
              schema:
                type: string
              example: |
                invoice_id,invoice_date,supplier,category,amount,notes
                INV-TEMPLATE-001,2026-01-15,Example Produce Co.,produce,250.00,Weekly produce delivery
                INV-TEMPLATE-002,2026-01-16,Example Beverage Distributors,beverage,180.50,"Kegs, soft drinks, mixers"
        "405":
          description: Any method other than GET.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ------------------------------------------------------------------
  /api/ask:
    post:
      tags: [Ask]
      summary: Ask a natural-language question about the reconciled data
      description: |
        The one model-backed endpoint. Sequences, per request:

        1. **Exact-match cache probe** (`internal/answercache`) — a
           byte-identical previously-answered question (whitespace/case
           ignored) is served verbatim with zero model calls. Refusals and
           clarifications are cached too: the data hasn't changed, so
           re-deciding costs nothing new to learn.
        2. **Paraphrase check** (specs/004-semantic-cache), only on an
           exact-match *miss* against a non-empty cache: a small, real,
           billed Claude Haiku 4.5 call checks whether this question means
           the same thing as a recently-cached one, worded differently.
        3. **Ambiguity gate** (Claude Sonnet 5 as of 2026-08-29 — moved off
           Haiku 4.5 after a multi-year date-comparison bug; see
           `internal/llmclient/cost.go` — `internal/ambiguity`) —
           classifies the (resolved) question as `answerable`,
           `ambiguous`, or `unanswerable` *before* any expensive reasoning
           runs. `status` in the response is exactly one of `"answered"`,
           `"clarification_needed"`, or `"refused"`.
        4. **Explanation step** (Claude Sonnet 5, `internal/explain`) —
           only reached when the gate lets the question through. Calls a
           fixed set of typed, read-only MCP tools backed by the Go
           reconciliation engine and narrates the result. The model never
           computes a number itself.

        `pending_clarification` makes a clarification a real conversation:
        when the user replies to a `clarification_needed` response (e.g.
        "yes", or picking one of `clarifying_options`), the frontend posts
        the reply as `question` and echoes back the original question +
        the clarifying question asked, so the instrumentation log records
        exactly what the user typed rather than a synthesized sentence.

        `previous_exchange` does the same for a follow-up to a real ANSWER
        ("and the day before?", "why?") — one hop only, never an
        accumulating transcript. A request carries at most one of
        `pending_clarification` / `previous_exchange`.

        `interactions` reports the real, just-measured cost of every model
        call that actually ran this request (empty when serving from an
        exact-content cache hit — see `cache`). Every model interaction is
        logged to Postgres regardless of which branch below is taken —
        Constitution Principle VI.
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
            examples:
              plainQuestion:
                summary: A plain, answerable question
                value: { question: "what was margin on 2026-08-03?" }
              clarificationReply:
                summary: Replying to a prior clarifying question
                value:
                  question: "August 12-13"
                  pending_clarification:
                    original_question: "how was the weekend?"
                    clarifying_question: "Which weekend do you mean — August 10-11, or August 12-13 (the most recent one)?"
              answerFollowUp:
                summary: A bare follow-up to a real answer, not a clarification reply
                value:
                  question: "and the day before?"
                  previous_exchange:
                    question: "What was our margin on August 9th 2026?"
                    answer_text: "On August 9, 2026, your margin was -$70.58 — meaning you operated at a loss that day."
      responses:
        "200":
          description: |
            Always `200` for a well-formed request, regardless of outcome —
            `status` distinguishes an answer from a refusal from a
            clarification request; this is a normal, successful HTTP
            exchange in every case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
              examples:
                answered:
                  summary: "answered — real response for \"what was margin on 2026-08-03?\""
                  value:
                    status: answered
                    answer_text: "On 2026-08-03, margin came out to **-$120.26** (a loss) — total sales of $315.75 (POS $195.00 + delivery $120.50) against input costs of $410.00 and commissions of $25.76 (refunds were $0).\n\nOne thing to flag: a duplicate order (IFOOD-20260803-0011) was found and removed from the iFood data so it wasn't double-counted, so this figure already reflects the corrected number."
                    provenance_refs:
                      - "/data/live/delivery_platform_export.csv:11"
                      - "/data/live/pos_export.csv:10"
                      - "/data/live/supplier_cost_sheet.csv:4"
                    visualization:
                      kind: pie
                      title: "Where the day's revenue came from"
                      subtitle: "Gross sales by source, 2026-08-03"
                      value_label: "Gross sales (USD)"
                      source_tool: get_daily_summary
                      points:
                        - { label: iFood, value: 55.25, display: "$55.25" }
                        - { label: Just Eat Takeaway, value: 65.25, display: "$65.25" }
                        - { label: In-house POS, value: 195, display: "$195.00" }
                    suggested_followups:
                      - "Were there any discrepancies on 2026-08-03?"
                    interactions:
                      - { model_used: claude-haiku-4-5, input_tokens: 1784, output_tokens: 40, estimated_cost_usd: 0.001984, latency_ms: 1180 }
                      - { model_used: claude-sonnet-5, input_tokens: 7852, output_tokens: 203, estimated_cost_usd: 0.017734, latency_ms: 5809 }
                clarificationNeeded:
                  summary: "clarification_needed — real response for \"how was the weekend?\""
                  value:
                    status: clarification_needed
                    clarifying_question: "Which weekend do you mean — August 10–11, or August 12–13 (the most recent one)?"
                    clarifying_options: ["August 10–11", "August 12–13 (the most recent weekend)"]
                    interactions:
                      - { model_used: claude-haiku-4-5, input_tokens: 1777, output_tokens: 117, estimated_cost_usd: 0.002362, latency_ms: 1548 }
                      - { model_used: claude-sonnet-5, input_tokens: 772, output_tokens: 85, estimated_cost_usd: 0.002394, latency_ms: 1977 }
                refused:
                  summary: "refused — real response for \"what will next month margin be?\""
                  value:
                    status: refused
                    refusal_reason: "Data only goes through 2026-08-14, so next month's margin is outside that window and can't be forecasted from it."
                    interactions:
                      - { model_used: claude-haiku-4-5, input_tokens: 1779, output_tokens: 120, estimated_cost_usd: 0.002379, latency_ms: 2167 }
                      - { model_used: claude-sonnet-5, input_tokens: 770, output_tokens: 65, estimated_cost_usd: 0.00219, latency_ms: 1978 }
                cacheHitExact:
                  summary: Served from the exact-match answer cache — zero model calls this request
                  value:
                    status: answered
                    answer_text: "On 2026-08-03, margin came out to -$120.26 (a loss)..."
                    provenance_refs: ["/data/live/delivery_platform_export.csv:11"]
                    cache:
                      hit: true
                      cached_at: "2026-08-27T14:02:11Z"
                      cost_avoided_usd: 0.019718
                      match_kind: exact
                      note: "Exact question match (whitespace and case ignored). A reworded question is a new question and costs full price."
        "400":
          description: The body was not valid JSON, or `question` was empty. Plain-text body (`http.Error`), not the shared JSON error shape.
          content:
            text/plain:
              schema: { type: string }
              examples:
                badJson: { value: "invalid JSON body" }
                emptyQuestion: { value: "question is required" }
        "405":
          description: Any method other than POST. Plain-text body, not the shared JSON error shape.
          content:
            text/plain:
              schema: { type: string, example: "method not allowed" }
        "502":
          description: The ambiguity gate or the explanation step failed against the live Anthropic API (a real infrastructure failure, not a business refusal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                gateFailed: { value: { error: gate_failed, detail: "the ambiguity check failed; please try again" } }
                explanationFailed: { value: { error: explanation_failed, detail: "the explanation step failed; please try again" } }

components:
  schemas:
    # --- shared -------------------------------------------------------
    ErrorResponse:
      type: object
      description: The flat error shape every plain REST endpoint in this API shares (`writeJSONError`).
      properties:
        error:
          type: string
          description: A machine-readable error code (e.g. `invalid_input`, `not_found`, `query_failed`).
        detail:
          type: string
          description: A human-readable explanation — often the exact underlying Go error string.
      required: [error, detail]

    Money:
      type: string
      description: An already-formatted decimal string in dollars, never a float. May be negative (a real loss).
      pattern: '^-?\d+\.\d{2}$'
      example: "43.26"

    DateString:
      type: string
      format: date
      example: "2026-08-14"

    SourceRowRef:
      type: object
      description: Provenance for one figure — the exact source file and row it was computed from (Constitution Principle IV).
      properties:
        file: { type: string, example: "/data/live/delivery_platform_export.csv" }
        row: { type: integer, example: 2 }
      required: [file, row]

    DiscrepancyFlag:
      type: object
      description: Something reconciliation had to notice and handle explicitly — never silently dropped or smoothed over.
      properties:
        type:
          type: string
          enum:
            - duplicate_order_removed
            - missing_delivery_source
            - commission_mismatch
            - anomaly_threshold_breach
          example: duplicate_order_removed
        detail: { type: string, example: "Removed duplicate order IFOOD-20260803-0011 (appeared twice in the same export)." }
      required: [type, detail]

    Period:
      type: object
      properties:
        start: { $ref: "#/components/schemas/DateString" }
        end: { $ref: "#/components/schemas/DateString" }
      required: [start, end]

    # --- badges ---------------------------------------------------------
    BadgeCode:
      type: string
      enum: [clean_close, discrepancy_catcher, growth, engagement, campaign_creation]

    Badge:
      type: object
      properties:
        date: { $ref: "#/components/schemas/DateString" }
        code: { $ref: "#/components/schemas/BadgeCode" }
        name: { type: string, example: "Clean Close" }
        category: { type: string, enum: [reconciliation, growth, engagement, campaign_creation] }
        discrepancy_flag_types:
          type: array
          items: { type: string }
          description: Present only on a discrepancy_catcher badge.
        campaign_id:
          type: string
          description: Present only on a growth or campaign_creation badge.
        replaces_campaign_id:
          type: string
          description: Present only on a campaign_creation badge.
        usage_days:
          type: integer
          description: Present only on an engagement badge — how many distinct real usage days it fired at.
      required: [date, code, name, category]

    PointsLine:
      type: object
      properties:
        code: { $ref: "#/components/schemas/BadgeCode" }
        name: { type: string }
        count: { type: integer }
        points_each: { type: integer }
        points: { type: integer }
      required: [code, name, count, points_each, points]

    Points:
      type: object
      properties:
        total: { type: integer, description: Every point ever earned from badges — never decreases. }
        breakdown:
          type: array
          items: { $ref: "#/components/schemas/PointsLine" }
        spent: { type: integer, description: Points already redeemed against a promotion's spend (POST /api/promotions, payment_method:points), all-time. }
        available: { type: integer, description: total - spent — what's actually left to redeem right now. Never negative. }
      required: [total, breakdown, spent, available]

    BadgesResponse:
      type: object
      properties:
        badges:
          type: array
          items: { $ref: "#/components/schemas/Badge" }
        points: { $ref: "#/components/schemas/Points" }
      required: [badges, points]

    # --- reconciliation ---------------------------------------------------
    DailySummaryResult:
      type: object
      properties:
        date: { $ref: "#/components/schemas/DateString" }
        gross_sales_by_source:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Money" }
          example: { ifood: "69.50", just_eat_takeaway: "76.25", pos: "248.75" }
        total_delivery_gross_sales:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Sum of every gross_sales_by_source entry EXCEPT "pos" — delivery-platform revenue only.
        commissions: { $ref: "#/components/schemas/Money" }
        refunds: { $ref: "#/components/schemas/Money" }
        input_costs: { $ref: "#/components/schemas/Money" }
        margin: { $ref: "#/components/schemas/Money" }
        discrepancy_flags:
          type: array
          items: { $ref: "#/components/schemas/DiscrepancyFlag" }
        source_row_refs:
          type: array
          items: { $ref: "#/components/schemas/SourceRowRef" }
      required:
        - date
        - gross_sales_by_source
        - total_delivery_gross_sales
        - commissions
        - refunds
        - input_costs
        - margin
        - discrepancy_flags
        - source_row_refs

    ReconciliationResponse:
      type: object
      description: The period actually served is echoed back in start/end — a client that omitted them learns the real served range rather than assuming one.
      properties:
        start: { type: string, description: "YYYY-MM-DD, or empty string if the served period contains zero days." }
        end: { type: string, description: "YYYY-MM-DD, or empty string if the served period contains zero days." }
        days:
          type: array
          items: { $ref: "#/components/schemas/DailySummaryResult" }
      required: [start, end, days]

    # --- promotions -------------------------------------------------------
    PromotionRoiView:
      type: object
      properties:
        platform: { type: string, example: iFood }
        campaign_id: { type: string, example: IFOOD-CAMP-BOOST01 }
        period: { $ref: "#/components/schemas/Period" }
        spend: { $ref: "#/components/schemas/Money" }
        attributed_incremental_orders:
          type: integer
          nullable: true
          description: null together with attributed_incremental_revenue and roi when reason=attribution_unavailable.
        attributed_incremental_revenue:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: An already-formatted decimal string in dollars, or null. See Money.
          example: "214.00"
        roi:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: An already-formatted decimal string in dollars, or null. See Money.
          example: "34.00"
        reason:
          type: string
          enum: [attribution_unavailable]
          description: Set only when roi/attributed_* are null.
        flagged_negative: { type: boolean }
        source_row_refs:
          type: array
          items: { $ref: "#/components/schemas/SourceRowRef" }
        origin:
          type: string
          enum: [ingested, owner_created]
        replaces_campaign_id:
          type: string
          description: Set only on an owner_created record that named a replacement.
        payment_method:
          type: string
          enum: [money, points]
          description: How this campaign's spend (above) was funded. spend itself never changes based on this — ROI math is identical either way.
        points_spent:
          type: integer
          nullable: true
          description: Steward points redeemed to cover spend, at the fixed rate of 10 cents per point. Set only when payment_method is points.
      required: [platform, campaign_id, period, spend, attributed_incremental_orders, attributed_incremental_revenue, roi, flagged_negative, source_row_refs, origin, payment_method]

    PromotionsResponse:
      type: object
      properties:
        promotions:
          type: array
          items: { $ref: "#/components/schemas/PromotionRoiView" }
      required: [promotions]

    CreatePromotionRequest:
      type: object
      properties:
        platform: { type: string, example: iFood }
        campaign_id: { type: string, example: IFOOD-CAMP-AUTUMN }
        period: { $ref: "#/components/schemas/Period" }
        spend:
          type: string
          description: A decimal string, e.g. "120.00" — never a float.
          example: "120.00"
        replaces:
          type: string
          description: campaign_id of an existing promotion this record claims to replace. Omitted/empty means no replacement claim (no FR-007 check runs, no badge possible).
        payment_method:
          type: string
          enum: [money, points]
          default: money
          description: Pay this campaign's spend from earned Steward points instead of cash. Verified server-side against the real, live balance (GET /api/badges' points.available) at the fixed rate of 10 cents per point — a request that needs more points than are available is refused with 422 insufficient_points, and nothing is persisted.
      required: [platform, campaign_id, period, spend]

    CreatePromotionResponse:
      type: object
      properties:
        promotion: { $ref: "#/components/schemas/PromotionRoiView" }
        earned_campaign_creation_badge: { type: boolean }
        points_balance_after:
          type: integer
          description: The owner's real available points balance immediately after this request. Present only when payment_method was points.
      required: [promotion, earned_campaign_creation_badge]

    # --- platforms --------------------------------------------------------
    PlatformEconomicsView:
      type: object
      properties:
        source: { type: string, enum: [ifood, just_eat_takeaway] }
        display_name: { type: string, example: iFood }
        gross_sales: { $ref: "#/components/schemas/Money" }
        commission_paid: { $ref: "#/components/schemas/Money" }
        effective_rate:
          type: string
          pattern: '^\d+\.\d{2}%$'
          nullable: true
          description: An already-formatted percentage string, or null (never a fabricated "0.00%") when gross_sales is genuinely zero for the period.
          example: "22.06%"
        promo_spend: { $ref: "#/components/schemas/Money" }
        combined_cost: { $ref: "#/components/schemas/Money" }
        combined_effective_rate:
          type: string
          pattern: '^\d+\.\d{2}%$'
          nullable: true
          description: An already-formatted percentage string, or null. See effective_rate.
          example: "54.87%"
        source_row_refs:
          type: array
          items: { $ref: "#/components/schemas/SourceRowRef" }
      required: [source, display_name, gross_sales, commission_paid, effective_rate, promo_spend, combined_cost, combined_effective_rate, source_row_refs]

    PlatformComparisonResponse:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        days_included: { type: integer }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformEconomicsView" }
      required: [period, days_included, platforms]

    # --- usage --------------------------------------------------------
    RecordUsageResponse:
      type: object
      properties:
        recorded:
          type: boolean
          description: true if this call was today's FIRST recorded usage; false if today was already on file. Informational only.
      required: [recorded]

    # --- client errors --------------------------------------------------
    ClientErrorReportRequest:
      type: object
      properties:
        message: { type: string, description: "Required — a report with no message is not a report." }
        component: { type: string }
        stack: { type: string }
        url: { type: string }
        user_agent: { type: string }
      required: [message]

    ClientErrorLoggedResponse:
      type: object
      properties:
        logged:
          type: boolean
          description: Whether the underlying write actually succeeded. The endpoint still returns 202 even when false — a failed telemetry write is never surfaced as a client-facing error.
      required: [logged]

    # --- cost sheet ingestion --------------------------------------------
    CostSheetRowView:
      type: object
      properties:
        invoice_id: { type: string, example: INV-TEMPLATE-001 }
        invoice_date: { $ref: "#/components/schemas/DateString" }
        supplier: { type: string, example: "Example Produce Co." }
        category: { type: string, example: produce }
        amount: { $ref: "#/components/schemas/Money" }
        notes: { type: string }
        source_row_ref: { $ref: "#/components/schemas/SourceRowRef" }
      required: [invoice_id, invoice_date, supplier, category, amount, notes, source_row_ref]

    PreviewCostSheetResponse:
      type: object
      properties:
        row_count: { type: integer }
        total_amount: { $ref: "#/components/schemas/Money" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/CostSheetRowView" }
      required: [row_count, total_amount, rows]

    MarginSnapshotView:
      type: object
      properties:
        days: { type: integer }
        margin:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: An already-formatted decimal string in dollars, or null when there is no prior persisted reconciliation data at all (a real absence, never a fabricated "0.00").
          example: "-1842.30"
      required: [days, margin]

    CommitCostSheetResponse:
      type: object
      properties:
        rows_committed: { type: integer }
        before: { $ref: "#/components/schemas/MarginSnapshotView" }
        after: { $ref: "#/components/schemas/MarginSnapshotView" }
      required: [rows_committed, before, after]

    # --- ask --------------------------------------------------------------
    PendingClarification:
      type: object
      description: Set when `question` is a reply to a clarifying question this endpoint returned a moment ago.
      properties:
        original_question: { type: string }
        clarifying_question: { type: string }
      required: [original_question, clarifying_question]

    PreviousExchange:
      type: object
      description: >-
        Set when `question` may be a follow-up to a real ANSWER (not a
        clarifying question) the previous request returned — "and the day
        before?", "why?". Composed server-side (ambiguity.ComposeAnswerFollowUp)
        into the text actually classified, narrated, and used as the answer-
        cache key, so a bare follow-up never collides with a different prior
        exchange's cache entry. Deliberately one hop only: exactly the
        immediately preceding question and answer, never an accumulating
        transcript. Mutually exclusive with `pending_clarification` — a
        request carries at most one of the two.
      properties:
        question: { type: string, description: "The user's previous question, verbatim." }
        answer_text: { type: string, description: "The previous answer_text this endpoint returned for that question." }
      required: [question, answer_text]

    AskRequest:
      type: object
      properties:
        question: { type: string, example: "what was margin on 2026-08-03?" }
        pending_clarification: { $ref: "#/components/schemas/PendingClarification" }
        previous_exchange: { $ref: "#/components/schemas/PreviousExchange" }
      required: [question]

    CostInteraction:
      type: object
      description: One model call's real, measured cost.
      properties:
        model_used: { type: string, enum: [claude-haiku-4-5, claude-sonnet-5], example: claude-haiku-4-5 }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        estimated_cost_usd: { type: number, format: double }
        latency_ms: { type: integer }
      required: [model_used, input_tokens, output_tokens, estimated_cost_usd, latency_ms]

    CacheInfo:
      type: object
      description: Set only when this response was served from the answer cache without a full model call.
      properties:
        hit: { type: boolean }
        cached_at: { type: string, format: date-time }
        cost_avoided_usd:
          type: number
          format: double
          description: What the original (uncached) model calls cost — money this request did NOT spend. Never summed into interactions.
        match_kind:
          type: string
          enum: [exact, paraphrase]
        note:
          type: string
          description: The disclosed limitation of this match kind, stated so the UI never implies the cache is smarter than it is.
      required: [hit, cost_avoided_usd]

    VizPoint:
      type: object
      properties:
        label: { type: string }
        value: { type: number, description: "The figure in dollars, for geometry only (bar height / pie arc)." }
        display: { type: string, description: "The authoritative rendering — what the UI must actually print." }
        unavailable:
          type: boolean
          description: True for a category the deterministic layer refused to produce a figure for. Must render as an explicit \"no figure\" state, never a zero-height mark.
        reason: { type: string }
      required: [label, value, display]

    Visualization:
      type: object
      description: An optional structured rendering of the same deterministic tool result the answer was narrated from. Exactly one of (columns+rows) or points is populated, per kind.
      properties:
        kind: { type: string, enum: [table, bar, pie] }
        title: { type: string }
        subtitle: { type: string }
        value_label: { type: string }
        source_tool:
          type: string
          description: The MCP tool this visualization was derived from — provenance for the chart itself.
          example: get_daily_summary
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/VizPoint" }
      required: [kind, title, source_tool]

    AskResponse:
      type: object
      properties:
        status:
          type: string
          enum: [answered, clarification_needed, refused]
        answer_text: { type: string, description: "Populated only when status=answered." }
        provenance_refs:
          type: array
          items: { type: string }
          description: "\"<file>:<row>\" strings — populated only when status=answered."
        clarifying_question: { type: string, description: "Populated only when status=clarification_needed." }
        clarifying_options:
          type: array
          items: { type: string }
          description: One-tap phrasings of a reply to clarifying_question. Each is re-classified from scratch if tapped, never treated as an established fact.
        assumption_stated: { type: string, description: "Populated only when the gate resolved an ambiguous question by stating an assumption instead of asking." }
        refusal_reason: { type: string, description: "Populated only when status=refused." }
        visualization: { $ref: "#/components/schemas/Visualization" }
        suggested_followups:
          type: array
          items: { type: string }
          description: >-
            0-3 natural-language next questions, generated deterministically
            in Go (httpapi.deriveFollowUpSuggestions) from the real tool
            invocation and arguments that grounded this answer — never a
            second model call. Populated only when status=answered; empty or
            absent is a normal, honest outcome when nothing sensible applies.
        cache: { $ref: "#/components/schemas/CacheInfo" }
        interactions:
          type: array
          items: { $ref: "#/components/schemas/CostInteraction" }
          description: One entry per model call that actually ran this request. Empty when served from an exact-match cache hit.
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCallView" }
          description: >-
            "Show your work" (spec 008 FR-003): the exact MCP tool name(s)
            invoked while answering, and the raw JSON result(s) already
            returned internally for this response — no new tool call, no
            re-computation. Populated only when status=answered; empty or
            absent whenever no tool ran (a refusal or clarification never
            reaches one).
      required: [status]

    ToolCallView:
      type: object
      properties:
        name: { type: string, description: "The exact MCP tool name invoked, e.g. get_daily_summary." }
        result_json: { description: "The tool's raw JSON result, embedded verbatim (not double-encoded as a string)." }
      required: [name, result_json]
