version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - bodyclose
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      # Table-driven tests commonly shadow `err`/loop vars across subtests.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AbnerAraujo/restaurant-margin-copilot/backend

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
