services:
  postgres:
    image: postgres:16-alpine
    container_name: margin-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-margin_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-margin_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margin_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-margin_copilot} -d $${POSTGRES_DB:-margin_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
