# Accuracy evaluation (spec.md SC-001, User Story 2).
#
# 15 questions with golden answers quoted VERBATIM from
# docs/live-integration-test-scenarios.md, which in turn quotes them
# directly from backend/cmd/gendata/opening/README.md's independently-
# computed reference tables for the dataset's hand-authored opening window
# (2024-08-01..14 — no hand-derived sums here, per that doc's own note).
# See evaluation/golden/accuracy.yaml for the golden-answer record.
#
# Target: the live backend's POST /api/ask (real Anthropic API calls
# through the Sonnet 5 ambiguity gate + Sonnet 5 explain step — the gate
# moved off Haiku 4.5 on 2026-08-29, see internal/llmclient/cost.go — no
# mocking). Start the server first:
#   go run ./cmd/server -serve :8092   (from backend/)
#
# Every question carries an explicit year: the dataset runs 2024-08-01
# through today, so a year-less "August 1st" would ground to the most
# recent August, not the opening window.
#
# Grading note: a "correct" answer here means status == "answered" AND
# the answer text contains the golden figure. A clarification_needed or
# refused result is graded FAIL for accuracy purposes even though it may
# be the constitutionally-preferred behavior under Principle II — this
# file measures "did it produce the right number", not "did it behave
# safely". Both are worth reporting, which is why gate/refusal behavior
# is captured separately by refusal.yaml and manually noted here too.

description: "Accuracy: 15 questions with known-correct answers from the hand-authored opening window"

prompts:
  - "{{question}}"

providers:
  - id: http
    config:
      url: http://localhost:8092/api/ask
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{question}}"
      transformResponse: "json"

defaultTest:
  options:
    provider:
      id: http

tests:
  - description: "A1"
    vars:
      question: "Delivery revenue on 2024-08-01?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /374\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A2"
    vars:
      question: "Delivery revenue on 2024-08-03? (tests duplicate-order dedup)"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /501\\.50/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A3"
    vars:
      question: "POS revenue on 2024-08-10?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /1[,]?204\\.50/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A4"
    vars:
      question: "Supplier cost total for 2024-08-01 through 2024-08-14?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /5[,]?002\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A5"
    vars:
      question: "iFood's share of delivery revenue on 2024-08-01?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /196\\.50/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A6"
    vars:
      question: "Just Eat Takeaway's share on 2024-08-01?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /178\\.25/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  # A7's second assertion checks the SIGN, not the word "flagged": the
  # previous suite failed a correct answer purely because it disclaimed
  # the flag in a sentence containing the word ("Not flagged as negative
  # ROI") — a documented grading-regex false negative this rebuild fixes.
  - description: "A7"
    vars:
      question: "ROI on campaign IFOOD-CAMP-BOOST01?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /62\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
      - type: javascript
        value: "!/-\\$?62\\.75/.test(output?.answer_text ?? '')"

  - description: "A8"
    vars:
      question: "ROI on campaign JET-CAMP-LUNCHFIX?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /450\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
      - type: javascript
        value: "/-\\$?450\\.75|negative|loss|underperform/i.test(output?.answer_text ?? '')"

  - description: "A9"
    vars:
      question: "ROI on campaign JET-CAMP-NEWMENU?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /33\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
      - type: javascript
        value: "!/-\\$?33\\.75/.test(output?.answer_text ?? '')"

  # A10 is period-bounded on purpose: the full multi-year dataset has its
  # own negative-ROI campaigns in later months, so only the opening window
  # has a single known-correct answer.
  - description: "A10"
    vars:
      question: "Which campaigns should be flagged as underperforming between 2024-08-01 and 2024-08-14?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /LUNCHFIX/i.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A11"
    vars:
      question: "Delivery revenue on 2024-08-04?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /395\\.00/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A12"
    vars:
      question: "Delivery revenue on 2024-08-14?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /367\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A13"
    vars:
      question: "iFood's share on 2024-08-14?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /187\\.25/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A14"
    vars:
      question: "Just Eat Takeaway's share on 2024-08-05?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /141\\.00/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  - description: "A15"
    vars:
      question: "Delivery revenue on 2024-08-02, net of the refund?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /384\\.00/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
