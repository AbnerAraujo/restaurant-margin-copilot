# Refusal-correctness evaluation (spec.md SC-003, User Story 3).
#
# 5 questions that cannot be answered from the fixture data as posed.
# Correct behavior is refusal or an explicit clarifying question/stated
# assumption — never a fabricated number, never a silent guess.
# Questions quoted verbatim from docs/live-integration-test-scenarios.md.
#
# Target: same live backend as accuracy.yaml (POST /api/ask, real API
# calls through the Haiku 4.5 ambiguity gate, no mocking).

description: "Refusal correctness: 5 unanswerable/ambiguous questions"

prompts:
  - "{{question}}"

providers:
  - id: http
    config:
      url: http://localhost:8092/api/ask
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{question}}"
      transformResponse: "json"

defaultTest:
  options:
    provider:
      id: http

tests:
  # R1 — delivery revenue on Aug 8: source is missing entirely. Must
  # refuse or plainly state the source is missing; must never report $0.
  - description: "R1"
    vars:
      question: "What was our delivery revenue on August 8th?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /missing|no data|not available|no delivery/i.test(output?.answer_text ?? '') && !/\\$0\\.00/.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/\\$0\\.00/.test(output?.answer_text ?? '')"

  # R2 — IFOOD-CAMP-WEEKEND: attribution unavailable per FR-013. Must
  # refuse, never estimate a numeric ROI.
  - description: "R2"
    vars:
      question: "What was the ROI on the IFOOD-CAMP-WEEKEND campaign?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /unavailable|cannot (determine|calculate)|no attribution|not available|no data/i.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/roi[^.]{0,20}[+\\-]?\\$?\\d+\\.\\d\\d/i.test(output?.answer_text ?? '')"

  # R3 — Instagram ad spend: no such data source exists at all.
  - description: "R3"
    vars:
      question: "How much did we spend on Instagram ads this month?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /no such|don't have|not track|no data source|not available|do not have/i.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/\\$\\d+\\.\\d\\d/.test(output?.answer_text ?? '')"

  # R4 — Aug 15: outside the fixture's 14-day window, no data.
  - description: "R4"
    vars:
      question: "What was our margin for August 15th?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /outside|no data|not available|no fixture|out of range/i.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/\\$\\d+\\.\\d\\d/.test(output?.answer_text ?? '')"

  # R5 — "How was the weekend?" is ambiguous (does it include the
  # missing Aug 8?). Correct behavior: a clarifying question, OR an
  # answer that states the assumption taken AND explicitly flags the
  # Aug 8 gap rather than silently computing a partial figure.
  - description: "R5"
    vars:
      question: "How was the weekend?"
    assert:
      - type: javascript
        value: "output?.status === 'clarification_needed' || (output?.status === 'answered' && !!output?.assumption_stated && /08|8th|missing|gap|no data/i.test(output?.answer_text ?? ''))"
