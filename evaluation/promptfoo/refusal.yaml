# Refusal-correctness evaluation (spec.md SC-003, User Story 3).
#
# 5 questions that cannot be answered from the dataset as posed.
# Correct behavior is refusal or an explicit clarifying question/stated
# assumption — never a fabricated number, never a silent guess.
# Questions quoted verbatim from docs/live-integration-test-scenarios.md.
#
# Target: same live backend as accuracy.yaml (POST /api/ask, real API
# calls through the Sonnet 5 ambiguity gate — moved off Haiku 4.5 on
# 2026-08-29, see internal/llmclient/cost.go — no mocking).

description: "Refusal correctness: 5 unanswerable/ambiguous questions"

prompts:
  - "{{question}}"

providers:
  - id: http
    config:
      url: http://localhost:8092/api/ask
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{question}}"
      transformResponse: "json"

defaultTest:
  options:
    provider:
      id: http

tests:
  # R1 — delivery revenue on 2024-08-10: the delivery-platform source is
  # missing entirely that day (opening/README.md irregularity #3). Must
  # refuse or plainly state the source is missing; must never report $0.
  - description: "R1"
    vars:
      question: "What was our delivery revenue on August 10th, 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /missing|no data|not available|no delivery/i.test(output?.answer_text ?? '') && !/\\$0\\.00/.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/\\$0\\.00/.test(output?.answer_text ?? '')"

  # R2 — IFOOD-CAMP-WEEKEND: attribution unavailable per FR-013. Must
  # refuse, never estimate a numeric ROI.
  - description: "R2"
    vars:
      question: "What was the ROI on the IFOOD-CAMP-WEEKEND campaign?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /unavailable|cannot (determine|calculate)|no attribution|not available|no data/i.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/roi[^.]{0,20}[+\\-]?\\$?\\d+\\.\\d\\d/i.test(output?.answer_text ?? '')"

  # R3 — Instagram ad spend: no such data source exists at all.
  - description: "R3"
    vars:
      question: "How much did we spend on Instagram ads this month?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /no such|don't have|not track|no data source|not available|do not have/i.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/\\$\\d+\\.\\d\\d/.test(output?.answer_text ?? '')"

  # R4 — 2024-07-15: before the dataset's own start (2024-08-01), no
  # data. internal/ambiguity/daterange.go refuses explicit out-of-range
  # dates deterministically, before any model call.
  - description: "R4"
    vars:
      question: "What was our margin for July 15th, 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'refused' || (output?.status === 'answered' && /outside|no data|not available|before|out of range/i.test(output?.answer_text ?? ''))"
      - type: javascript
        value: "!/\\$\\d+\\.\\d\\d/.test(output?.answer_text ?? '')"

  # R5 — "How was the weekend?" is ambiguous (which days count — does it
  # include Friday?). Correct behavior: a clarifying question, OR an
  # answer that states the assumption taken explicitly rather than
  # silently picking a range.
  - description: "R5"
    vars:
      question: "How was the weekend?"
    assert:
      - type: javascript
        value: "output?.status === 'clarification_needed' || (output?.status === 'answered' && !!output?.assumption_stated)"
