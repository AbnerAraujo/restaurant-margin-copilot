# Consistency evaluation (spec.md SC-002, User Story 2).
#
# 5 question sets x 3 phrasings each = 15 live calls. Each phrasing is
# graded individually against the set's target below (quoted verbatim
# from docs/live-integration-test-scenarios.md, grounded in the dataset's
# hand-authored opening window, 2024-08-01..14); TRUE consistency also
# requires the 3 answers within a set to agree WITH EACH OTHER, not just
# each independently matching the target text — promptfoo grades each
# test row independently, so cross-phrasing agreement within a set must
# be checked by a human/agent reading the raw JSON output
# (-o results.json) side by side, which the harness run report does.
#
# Target: same live backend as accuracy.yaml (POST /api/ask, real API
# calls, no mocking). Phrasings carry the year explicitly — the dataset
# spans 2024-08-01 through today, so a year-less date grounds to the most
# recent match.

description: "Consistency: 5 sets x 3 phrasings, checked for agreement"

prompts:
  - "{{question}}"

providers:
  - id: http
    config:
      url: http://localhost:8092/api/ask
      method: POST
      headers:
        Content-Type: application/json
      body:
        question: "{{question}}"
      transformResponse: "json"

defaultTest:
  options:
    provider:
      id: http

tests:
  # C1 — all must agree on $374.75
  - description: "C1a"
    vars:
      set: "C1"
      question: "What was the delivery revenue on August 1st, 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /374\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C1b"
    vars:
      set: "C1"
      question: "How much did delivery bring in on Aug 1, 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /374\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C1c"
    vars:
      set: "C1"
      question: "Delivery total for 2024-08-01?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /374\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  # C2 — the substantive claim all three phrasings must agree on: the
  # duplicate was caught and counted ONCE. The previous suite additionally
  # required the day's $501.50 total to appear, which graded correct
  # "counted once" answers as failures purely for not volunteering a
  # figure the question never asked for — a disclosed regex-strictness
  # false negative this rebuild removes (the C2a phrasing keeps its
  # explicit guard against the answer claiming the double-count stood).
  - description: "C2a"
    vars:
      set: "C2"
      question: "Did order IFOOD-20240803-0011 get counted twice?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /counted (it )?(only )?once|only counted once|deduplicat|collapsed|duplicate.{0,60}(removed|caught|flagged)/i.test(output?.answer_text ?? '') && !/counted twice into|still counted twice/i.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C2b"
    vars:
      set: "C2"
      question: "Is there a duplicate order on August 3rd, 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /counted (it )?(only )?once|only counted once|deduplicat|collapsed|duplicate.{0,60}(removed|caught|flagged)/i.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C2c"
    vars:
      set: "C2"
      question: "Check for duplicate orders around Aug 3, 2024."
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /counted (it )?(only )?once|only counted once|deduplicat|collapsed|duplicate.{0,60}(removed|caught|flagged)/i.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  # C3 — negative ROI, -$450.75, flagged
  - description: "C3a"
    vars:
      set: "C3"
      question: "Is the LUNCHFIX campaign profitable?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /450\\.75/.test(output?.answer_text ?? '') && /negative|not profitable|loss|underperform/i.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C3b"
    vars:
      set: "C3"
      question: "Should we stop the JET-CAMP-LUNCHFIX promotion?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /450\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C3c"
    vars:
      set: "C3"
      question: "What's the ROI on our Just Eat lunch fixed-price campaign?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /450\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  # C4 — $231.75 (gross, pre-refund-net; refund is a separate line item)
  - description: "C4a"
    vars:
      set: "C4"
      question: "What was iFood's delivery revenue on August 2nd, 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /231\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C4b"
    vars:
      set: "C4"
      question: "How much did iFood bring in on the 2nd of August 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /231\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"
  - description: "C4c"
    vars:
      set: "C4"
      question: "iFood revenue, Aug 2 2024?"
    assert:
      - type: javascript
        value: "output?.status === 'answered' && /231\\.75/.test(output?.answer_text ?? '') && (output?.provenance_refs?.length ?? 0) > 0"

  # C5 — consistently states no delivery-platform data for 2024-08-10;
  # never fabricates a $0 or omits the gap silently. The requirement is
  # explicit missing-data language. A blanket "no $0.00 anywhere" guard
  # (the previous suite's form) failed answers that showed "$0.00" while
  # explicitly disclaiming it ("this isn't because delivery was actually
  # zero — it's flagged as missing"), which is correct behavior, not a
  # fabricated zero; the required missing-language clause is what
  # actually catches an undared $0 presented as real (no missing
  # language accompanies a fabricated figure).
  - description: "C5a"
    vars:
      set: "C5"
      question: "Do we have delivery data for August 10th, 2024?"
    assert:
      - type: javascript
        value: "(output?.status === 'refused') || (output?.status === 'clarification_needed') || (output?.status === 'answered' && /no (delivery|data)|missing|not available|no orders|no export rows/i.test(output?.answer_text ?? ''))"
  - description: "C5b"
    vars:
      set: "C5"
      question: "Was anything from the delivery platform recorded on Aug 10, 2024?"
    assert:
      - type: javascript
        value: "(output?.status === 'refused') || (output?.status === 'clarification_needed') || (output?.status === 'answered' && /no (delivery|data)|missing|not available|no orders|no export rows/i.test(output?.answer_text ?? ''))"
  - description: "C5c"
    vars:
      set: "C5"
      question: "Show me iFood and Just Eat orders for 2024-08-10."
    assert:
      - type: javascript
        value: "(output?.status === 'refused') || (output?.status === 'clarification_needed') || (output?.status === 'answered' && /no (delivery|data)|missing|not available|no orders|no export rows/i.test(output?.answer_text ?? ''))"
